<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>...</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: white;
      color: black;
      font-family: Arial, sans-serif;

      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      text-align: center;
    }

    .pagina {
      width: 90%;
      max-width: 500px;
    }

    .pista {
      font-size: 18px;
      line-height: 1.7;
      margin-bottom: 30px;
    }

    input {
      width: 100%;
      max-width: 320px;

      padding: 14px;

      border: 1px solid black;

      background: white;
      color: black;

      font-size: 16px;
      text-align: center;

      outline: none;
    }

    button {
      display: block;

      margin: 18px auto 0;

      padding: 12px 25px;

      border: 1px solid black;

      background: white;
      color: black;

      font-size: 14px;

      cursor: pointer;
    }

    button:hover {
      background: black;
      color: white;
    }

    .mensagem {
      margin-top: 20px;
      font-size: 14px;
      min-height: 20px;
    }

    #etapa2 {
      display: none;
    }

    .spotify {
      display: inline-block;

      margin-top: 25px;

      color: black;
      text-decoration: none;

      border: 1px solid black;

      padding: 12px 22px;

      font-size: 15px;
    }

    .spotify:hover {
      background: black;
      color: white;
    }
  </style>
</head>

<body>

  <div class="pagina">

    <!-- ETAPA 1 -->

    <div id="etapa1">

      <div class="pista">

        Ele se move usando a terceira lei de Newton,
        que afirma que para toda ação há uma reação
        igual e oposta.

      </div>


      <input
        type="text"
        id="resposta"
        placeholder="Digite a resposta"
        autocomplete="off"
      >


      <button onclick="verificarResposta()">

        DESBLOQUEAR

      </button>


      <div
        class="mensagem"
        id="mensagem">
      </div>

    </div>


    <!-- ETAPA 2 -->

    <div id="etapa2">

      <div class="pista">

        Σπότιφαϊ

        <br><br>

        Hubble-Floats-Free

      </div>


      <a
        class="spotify"
        href="https://open.spotify.com/playlist/272y43cH5m7wrM2HaSV200"
        target="_blank"
      >

        CONTINUAR

      </a>

    </div>

  </div>


  <script>

    function verificarResposta() {

      const resposta =
        document
          .getElementById("resposta")
          .value
          .trim()
          .toLowerCase();


      const mensagem =
        document.getElementById("mensagem");


      if (resposta === "hubble") {

        document
          .getElementById("etapa1")
          .style.display = "none";


        document
          .getElementById("etapa2")
          .style.display = "block";


      } else {

        mensagem.textContent =
          "Hmm... não é essa. Tente novamente.";

      }

    }

  </script>

</body>

</html>
